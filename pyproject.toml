[project]
name = "docs-search-mcp"
version = "0.1.0"
description = "A small MCP server: search/read local notes, fetch web pages safely, convert times between timezones"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["mcp>=1.29,<2", "httpx>=0.27", "markdownify>=0.13", "tzdata>=2024.1"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[project.scripts]
docs-search-mcp = "docs_search_mcp.server:main"

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
